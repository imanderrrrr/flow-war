name: Performance branch validation
on:
  push:
    branches:
      - codex/entrega-7-performance-pass-1
  pull_request:
    branches:
      - codex/entrega-7-qa-cto-team-ai
      - codex/entrega-7-performance-pass-1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: npm test on the per-command route (FLOW_GROUP_COMMIT=0)
        run: npm test
        env:
          FLOW_GROUP_COMMIT: '0'
      - run: npm run build
