name: Performance branch validation
on:
  push:
    branches:
      - codex/entrega-7-performance-pass-1
  pull_request:
    branches:
      - codex/entrega-7-qa-cto-team-ai

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
